name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # End-to-end tests need a desktop; run them on Windows only (the tested platform).
      - if: matrix.os == 'windows-latest'
        run: npm run test:e2e
