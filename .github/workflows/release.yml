# Publishes the portable Windows build as a GitHub Release when a tag like v1.2.0 is pushed.
# The notes come from the version's CHANGELOG.md section (the app's update dialog shows them) plus install steps.
# The zip contains the GPL ffmpeg binary, so the notes link its source (see THIRD_PARTY_NOTICES.md).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package -- --zip
      - uses: actions/upload-artifact@v7
        with:
          name: Garlic-win32-x64
          path: out/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.js ${{ github.ref_name }} > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          body_path: release-notes.md
