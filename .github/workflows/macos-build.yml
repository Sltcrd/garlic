# EXPERIMENTAL, manual: builds Garlic.app for Apple silicon so it can be tried without building it locally.
# The app is only ad-hoc signed (no Apple Developer ID, no notarisation): Gatekeeper asks for approval, see docs/PLATFORMS.md.
# Run it from Actions → "macOS build (experimental)" → Run workflow, then download the artifact.
name: macOS build (experimental)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package --zip
      # Informational: run the end-to-end tests against the packaged app. The click hook needs the Accessibility
      # permission, which a CI runner does not have, so this also checks that Garlic starts and degrades gracefully.
      - name: Smoke test the packaged app
        continue-on-error: true
        env:
          GARLIC_BIN: ${{ github.workspace }}/out/Garlic-darwin-arm64/Garlic.app/Contents/MacOS/Electron
        run: node --test tests/e2e/smoke.test.js
      - name: SHA-256
        run: shasum -a 256 out/Garlic-darwin-arm64.zip | tee out/Garlic-darwin-arm64.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Garlic-macOS-arm64-experimental
          path: |
            out/Garlic-darwin-arm64.zip
            out/Garlic-darwin-arm64.zip.sha256
