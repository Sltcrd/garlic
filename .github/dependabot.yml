# Dependabot version updates. Security alerts/updates are enabled in the repository settings and are not delayed.
version: 2
updates:
  # pnpm projects use the "npm" ecosystem (pnpm-lock.yaml is supported).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    # Do not propose a release until it has been public for a week: most malicious versions are found and pulled within days.
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
